[project]
name = "embeddings-explorer"
version = "0.1.0"
description = "Notebook-Projekt: Text-Embeddings eines lokalen Ollama-Servers untersuchen und visualisieren"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
